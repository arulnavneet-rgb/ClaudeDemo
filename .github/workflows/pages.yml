# Checks both boards on every push and pull request, then publishes them to
# GitHub Pages on every push to main: index.html at the root, v2/index.html at /v2/.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Both boards exist
        run: test -f index.html && test -f v2/index.html

      # The FormSubmit call is the only allowed network request
      - name: No external resources
        run: |
          if grep -nE '(src|href)=["'\'']https?://' index.html v2/index.html | grep -v 'formsubmit\.co'; then
            echo "::error::External resource found (see lines above)"
            exit 1
          fi

      # Brief: no persistence, no alert/confirm, no !important
      - name: No banned APIs
        run: |
          if grep -nE 'localStorage|sessionStorage|indexedDB|document\.cookie|alert\(|confirm\(|!important' index.html v2/index.html; then
            echo "::error::Banned API or !important found (see lines above)"
            exit 1
          fi

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only the two boards, not repo docs
      - name: Stage site
        run: |
          mkdir -p _site/v2
          cp index.html _site/
          cp v2/index.html _site/v2/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
